name: CI

on:
  push:
  pull_request:

# Read-only: nothing in this workflow writes to the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The database is a throwaway container that exists only for this job and
  # is never reachable from outside it, so there is no credential here to
  # keep out of source control. POSTGRES_HOST_AUTH_METHOD=trust is what lets
  # it stay that way instead of inventing a password to commit.
  TEST_DB_USERNAME: postgres
  TEST_DB_PASSWORD: ""
  TEST_DB_NAME: conduit_test
  TEST_DB_HOSTNAME: 127.0.0.1
  TEST_DB_PORT: "5432"
  TEST_DB_DIALECT: postgres
  TEST_DB_LOGGING: "false"
  DEV_DB_USERNAME: postgres
  DEV_DB_PASSWORD: ""
  DEV_DB_NAME: conduit_development
  DEV_DB_HOSTNAME: 127.0.0.1
  DEV_DB_PORT: "5432"
  DEV_DB_DIALECT: postgres
  DEV_DB_LOGGING: "false"

jobs:
  build-and-test:
    name: Lint, migrate, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Create the databases
        run: |
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE conduit_test;'
          psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE conduit_development;'

      - name: Generate a JWT key for this run
        # Per-run and never stored, so there is no secret to rotate or leak.
        run: echo "JWT_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Lint
        run: npm run lint

      - name: Migrations rebuild the database from clean
        # Up, all the way back down, then up again. This is what proves the
        # schema is reproducible from an empty database and that every
        # migration is reversible - the gap that let the original repo ship
        # migrations the app could not actually run on.
        working-directory: backend
        env:
          NODE_ENV: test
        run: |
          npx sequelize-cli db:migrate
          npx sequelize-cli db:migrate:undo:all
          npx sequelize-cli db:migrate

      - name: Backend tests
        run: npm run test:backend

      - name: Frontend tests
        run: npm run test:frontend

      - name: Build the frontend
        run: npm run build -w frontend

      - name: Boot the backend against the migrated database
        # The backend has no build step, so the equivalent check is that it
        # starts against a migration-built database and answers a request.
        env:
          NODE_ENV: development
          PORT: "3001"
        run: |
          cd backend
          npx sequelize-cli db:migrate
          node index.js &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3001/api/tags > /dev/null; then
              echo "backend answered /api/tags"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not come up" >&2
          exit 1

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Create the database
        run: psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE conduit_development;'

      - name: Generate a JWT key for this run
        run: echo "JWT_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Migrate
        working-directory: backend
        run: npx sequelize-cli db:migrate

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end flow
        env:
          PORT: "3001"
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
